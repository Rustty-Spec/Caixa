name: Gerar APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon 2>&1 | tee ../build.log
      - name: Publicar o APK no repositório
        if: always()
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then cp android/app/build/outputs/apk/debug/app-debug.apk caixa.apk; rm -f build-erro.log; else tail -80 build.log > build-erro.log; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add caixa.apk build-erro.log 2>/dev/null || true
          git add -A caixa.apk build-erro.log 2>/dev/null || true
          git commit -m "APK gerado [skip ci]" || echo "nada novo"
          git push
